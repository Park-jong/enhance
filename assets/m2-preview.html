<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M2 아이콘 미리보기</title>
<style>
  :root {
    --bg: #0e1016;
    --panel: #161922;
    --panel2: #1d2130;
    --line: #2a2f40;
    --text: #e8eaf0;
    --muted: #8a91a5;
    --gold: #ffd166;
    --good: #4cd97b;
    --bad: #ff4d6d;
    --warn: #ff9f1c;
    --info: #4da3ff;
    --accent: #7c5cff;
    --tier: #3a4060;
  }
  body.light { --bg: #f2f3f7; --panel: #ffffff; --panel2: #e8eaf2; --line: #c9cddb; --text: #1a1d28; --muted: #5a6075; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
  h1 { font-size: 18px; margin: 0 0 12px; color: var(--gold); }
  h2 { font-size: 15px; margin: 24px 0 8px; color: var(--info); }
  button.tg { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; cursor: pointer; font-family: inherit; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
  .card .k { font: 12px monospace; color: var(--muted); margin-bottom: 6px; word-break: break-all; }
  .sizes { display: flex; align-items: flex-end; gap: 10px; color: var(--text); }
  .sizes span { display: inline-block; line-height: 0; }
  svg { width: 1em; height: 1em; display: block; }
  .ic-inline { display: inline-block; width: 1.1em; height: 1.1em; vertical-align: -0.2em; line-height: 0; }
  .ic-inline svg { width: 100%; height: 100%; }
  .row { display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; max-width: 520px; }
  .row .ico { font-size: 28px; line-height: 0; flex: none; }
  .row .nm { font-weight: 600; }
  .row .ds { color: var(--muted); font-size: 12px; }
  .pips { display: inline-flex; gap: 2px; margin-left: auto; }
  .pips i { width: 5px; height: 5px; border-radius: 50%; background: var(--tier); display: block; }
  .pips i.on { background: var(--gold); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; background: var(--panel2); border: 1px solid var(--warn); border-radius: 999px; padding: 4px 10px 4px 6px; font-size: 13px; }
  .chip .ico { font-size: 20px; line-height: 0; }
  .chip small { color: var(--muted); }
  .toast { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--gold); border-radius: 10px; padding: 8px 12px; margin-bottom: 6px; max-width: 460px; }
  .toast .ico { font-size: 32px; line-height: 0; flex: none; }
  .toast b { display: block; color: var(--gold); }
  .toast span.d { color: var(--muted); font-size: 12px; }
  .mock { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; max-width: 520px; margin-bottom: 6px; }
  .sure { display: inline-flex; align-items: center; gap: 3px; color: var(--good); font-weight: 700; }
  .sure .ic-inline { width: 14px; height: 14px; vertical-align: 0; }
  .note { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h1>M2 아이콘 미리보기</h1>
<p><button class="tg" id="tg">밝은 배경 전환</button> <span class="note">file:// 에서 그대로 열기. 크기 14 / 20 / 32 / 48px</span></p>

<h2>전체 아이콘</h2>
<div class="grid" id="icons"></div>

<h2>특성 행 (티어 점 1~3, CSS only)</h2>
<div id="traits"></div>

<h2>이벤트 칩</h2>
<div class="chips" id="chips"></div>

<h2>이벤트 토스트</h2>
<div id="toasts"></div>

<h2>천장 / 숙련 / 인라인(1.1em)</h2>
<div class="mock">천장 7/10 <span class="sure"><span class="ic-inline" data-i="sure_badge"></span>확정!</span></div>
<div class="mock"><span class="ic-inline" data-i="mastery"></span> +16 숙련 +6%p (2/4)</div>
<div class="mock">
  <span class="ic-inline" data-i="fame"></span> 명성 120 &nbsp;
  <span class="ic-inline" data-i="rebirth"></span> 환생 3회 &nbsp;
  <span class="ic-inline" data-i="monument"></span> 기념비 &nbsp;
  <span class="ic-inline" data-i="achievement"></span> 업적 12/40 &nbsp;
  <span class="ic-inline" data-i="title"></span> 칭호
</div>

<script src="./m2-icons.js"></script>
<script>
(function () {
  var I = window.M2_ICONS, keys = Object.keys(I);
  function $(id) { return document.getElementById(id); }
  var g = $('icons');
  keys.forEach(function (k) {
    var c = document.createElement('div'); c.className = 'card';
    c.innerHTML = '<div class="k">' + k + '</div><div class="sizes">' +
      [14, 20, 32, 48].map(function (n) { return '<span style="font-size:' + n + 'px">' + I[k] + '</span>'; }).join('') + '</div>';
    g.appendChild(c);
  });
  var T = [
    ['trait_hunt', '약탈자', '사냥 골드 보너스', 1], ['trait_work', '일꾼', '의뢰 보상 보너스', 2],
    ['trait_trade', '상인', '판매가 보너스', 3], ['trait_ore', '광부', '광석 획득 보너스', 2],
    ['trait_shard', '수집가', '조각 획득 보너스', 1], ['trait_anvil', '대장장이', '모루 효율 보너스', 3]
  ];
  $('traits').innerHTML = T.map(function (t) {
    var p = ''; for (var i = 1; i <= 3; i++) p += '<i' + (i <= t[3] ? ' class="on"' : '') + '></i>';
    return '<div class="row"><span class="ico">' + I[t[0]] + '</span><div><div class="nm">' + t[1] + '</div><div class="ds">' + t[2] + '</div></div><span class="pips" title="티어 ' + t[3] + '">' + p + '</span></div>';
  }).join('');
  var E = [
    ['event_luck', '행운의 시간', '강화 성공 확률 +5%p'], ['event_hunt', '사냥 대목', '수동 사냥 골드 +40%'],
    ['event_auto', '자동 풍년', '자동 사냥 골드 +50%'], ['event_ore', '광맥 발견', '사냥 광석 +50%'],
    ['event_anvil', '모루 가호', '모루 사용 시 40% 확률로 내구도 보존'], ['event_quest', '의뢰소 특가', '의뢰 새로고침 비용 −50%']
  ];
  $('chips').innerHTML = E.map(function (e) {
    return '<span class="chip"><span class="ico">' + I[e[0]] + '</span><b>' + e[1] + '</b><small>' + e[2] + '</small></span>';
  }).join('');
  $('toasts').innerHTML = E.map(function (e) {
    return '<div class="toast"><span class="ico">' + I[e[0]] + '</span><div><b>' + e[1] + '</b><span class="d">' + e[2] + '</span></div></div>';
  }).join('');
  Array.prototype.forEach.call(document.querySelectorAll('[data-i]'), function (el) { el.innerHTML = I[el.getAttribute('data-i')]; });
  $('tg').onclick = function () { document.body.classList.toggle('light'); };
})();
</script>
</body>
</html>
