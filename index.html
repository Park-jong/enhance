<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>검 강화하기</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <div class="logo">⚔️ 검 강화하기</div>
  <!-- 마지막 저장 시도가 실패한 동안 지속 배지(문구는 js/view.js) -->
  <span class="badge bad save-badge" id="saveBadge" role="status" hidden></span>
  <!-- 진행 중인 시간 이벤트 칩과 상세 팝오버(내용은 js/view.js). 이벤트가 없으면 숨김 -->
  <span class="event-wrap" id="eventWrap" hidden>
    <button class="event-chip" id="eventChip" aria-haspopup="dialog" aria-expanded="false" aria-controls="eventPop" hidden></button>
    <div class="popover event-pop" id="eventPop" hidden></div>
  </span>
  <!-- 보유한 가장 높은 단계 기념비(장식, 문구는 js/view.js) -->
  <span class="badge monument-badge" id="monumentBadge" hidden></span>
  <!-- 현재 칭호(업적 보상, 장식). 문구는 js/view.js -->
  <span class="title-badge" id="titleBadge" hidden></span>
  <div class="spacer"></div>
  <!-- 자원바·설정 묶음: 헤더가 줄바꿈하면 둘이 함께 오른쪽 끝에 붙는다(설정만 홀로 왼쪽에 떨어지지 않음) -->
  <div class="header-end">
    <div class="resbar">
      <div class="gold" id="goldBox"><span class="coin"></span><span id="gold">0</span></div>
      <div class="res-other" id="resOther"></div>
    </div>
    <div class="settings-wrap">
      <button class="icon-btn" id="btnSettings" title="설정">⚙️</button>
      <div class="popover" id="settingsPop" hidden>
        <label><input type="checkbox" id="setSound"> 🔊 소리</label>
        <label><input type="checkbox" id="setSkip"> ⏩ 강화 연출 건너뛰기</label>
        <button class="small-btn" id="btnReset" title="처음부터 다시">초기화</button>
        <!-- 게임 버전(C.VERSION, 문구는 js/view.js). 배포 뒤 새로고침 반영 확인용 -->
        <p class="muted app-version" id="appVersion"></p>
      </div>
    </div>
  </div>
  <!-- 보호 모드 배너: 닫을 수 없음. 헤더 안에 두어 항상 보이고, 탭 잠금 때 헤더와 함께 inert·잠금 화면 아래에 놓인다 -->
  <div class="save-guard" id="saveGuard" role="alert" hidden></div>
</header>

<main>
  <!-- 오른쪽 패널의 sticky 범위를 이 묶음으로 한정한다(아래 검 도감 카드를 가리지 않게) -->
  <div class="play">
    <div class="main-col">
      <section class="card">
        <h2>보관함 <span id="slotCount"></span></h2>
        <div class="strip" id="strip"></div>
        <div class="strip-actions" id="stripActions"></div>
      </section>

      <section class="card">
        <div class="title-row">
          <span class="rarity" id="rarity">일반</span>
          <span class="sword-name" id="swordName">+0 낡은 목검</span>
        </div>
        <p class="trait-line" id="traitLine" hidden></p>

        <div class="stage" id="stage">
          <div class="floor"></div>
          <div class="float"><div id="sword"></div></div>
          <canvas id="fx"></canvas>
          <div id="flash"></div>
          <div id="result"></div>
          <div class="stage-empty" id="stageEmpty" hidden></div>
        </div>

        <div class="info">
          <div><span>성공 확률</span><b id="vSucc" style="color:var(--good)">-</b><span class="gauge-line" id="gaugeLine" hidden></span></div>
          <div><span>파괴 확률</span><b id="vDest" style="color:var(--bad)">-</b> <span class="badge bad" id="destWarn" hidden>⚠ 보호 불가</span></div>
          <div><span>강화 비용</span><b id="vCost" style="color:var(--gold)">-</b></div>
          <div><span>판매 가격</span><b id="vSell" style="color:var(--gold)">-</b></div>
        </div>
        <div class="breakdown" id="breakdown"></div>
        <div class="pity-gauge" id="pityLine"></div>
        <p class="note" id="note"></p>
        <p class="income-note" id="incomeNote"></p>

        <h3 class="tray-title">소모품</h3>
        <div class="tray" id="tray"></div>

        <div class="actions">
          <button class="btn btn-enhance" id="btnEnhance">강화하기<kbd id="enhanceSub">Space</kbd></button>
          <button class="btn btn-sell" id="btnSell">판매<kbd>S</kbd></button>
          <button class="btn btn-hunt" id="btnHunt">사냥<kbd id="huntSub">H</kbd></button>
        </div>
        <div class="auto-row" id="autoRow"></div>
      </section>
    </div>

    <aside class="side">
      <nav class="tabbar" id="tabbar"></nav>
      <section class="card tab-panel" data-panel="shop"><h2>상점</h2><div class="panel-body"></div></section>
      <section class="card tab-panel" data-panel="forge" hidden><h2>대장간</h2><div class="panel-body"></div></section>
      <section class="card tab-panel" data-panel="quests" hidden><h2>납품 의뢰</h2><div class="panel-body"></div></section>
      <section class="card tab-panel" data-panel="idle" hidden><h2>방치</h2><div class="panel-body"></div></section>
      <section class="card tab-panel" data-panel="records" hidden>
        <h2>기록 <span class="title-tag" id="recordsTitle" hidden></span></h2>
        <!-- 섹션 순서: 환생(m2-rebirth §7, 맨 위) → 일일 과제 → 통계 → 숙련 → 기념비 → (로그) → 업적 (m2-achievements §12) -->
        <div class="rebirth-section" id="rebirthSection"></div>
        <div class="daily-section" id="dailySection"></div>
        <h2 class="rec-sec">통계</h2>
        <div class="stats" id="statsGrid"></div>
        <h2 style="margin-top:16px"><span id="masteryHeadIcon" aria-hidden="true"></span> 숙련 <span class="muted">(+15~+19 단계별 성공 기록)</span></h2>
        <ul class="mastery-list" id="masteryList"></ul>
        <h2 style="margin-top:16px">기념비 <span class="muted" id="monumentCount"></span></h2>
        <div class="monuments" id="monumentList"></div>
        <h2 style="margin-top:16px">로그</h2>
        <ul id="log"></ul>
        <div class="ach-section" id="achSection"></div>
      </section>
    </aside>
  </div>

  <section class="card full">
    <h2>검 도감 <span id="foundCount"></span></h2>
    <div class="collection" id="collection"></div>
  </section>
</main>

<div id="toasts"></div>
<div id="banner"><div class="inner"><div class="big" id="bannerBig"></div><div class="sub" id="bannerSub"></div></div></div>
<div id="modal" hidden></div>
<div id="tabLock" hidden>
  <div class="sheet">
    <h3>다른 탭에서 게임이 실행 중입니다</h3>
    <p>저장이 서로 덮어쓰이지 않도록 이 탭을 멈췄습니다. 다른 탭을 닫았거나 이 탭에서 이어서 하려면 아래 버튼을 누르세요. 누르면 다른 탭이 멈춥니다.</p>
    <button class="small-btn gold" id="btnTakeover">이 탭에서 계속하기</button>
  </div>
</div>

<!-- 규칙 모듈(node 테스트와 공용) → 화면 모듈 → 컨트롤러 순서로 로드. file:// 에서도 동작하도록 ES 모듈을 쓰지 않는다 -->
<script src="js/constants.js"></script>
<script src="js/events.js"></script>
<script src="js/rules.js"></script>
<script src="js/forge.js"></script>
<script src="js/idle.js"></script>
<script src="js/quests.js"></script>
<script src="js/save.js"></script>
<script src="js/rebirth.js"></script>
<script src="js/achievements.js"></script>
<!-- 콘텐츠 팀 아이콘·효과음(없어도 이모지·합성음으로 동작) -->
<script src="assets/m1-icons.js"></script>
<script src="assets/m2-icons.js"></script>
<script src="assets/m1-sfx.js"></script>
<script src="js/audio.js"></script>
<script src="js/fx.js"></script>
<script src="js/view.js"></script>
<script src="js/strip-drag.js"></script>
<script src="js/tab-guard.js"></script>
<script src="js/main.js"></script>
</body>
</html>
